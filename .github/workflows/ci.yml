name: ci
on: [push, pull_request]
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import json; json.load(open('plugin/library/index.json'))"
      - run: python3 plugin/skills/skillforge/scripts/compose.py --mode coding "fix bug reproduce"
