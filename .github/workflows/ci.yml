name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
        exclude:
          # ubuntu-latest (26.04) no longer provides Python 3.9 through setup-python.
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-22.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Embedded Postgres for the behavioral pg grader; graders fall back to static mode without it.
      - if: matrix.python == '3.12'
        run: python -m pip install -r requirements-dev.txt
      - run: npm test
      - run: npm run validate:library
      # Regression floors on the development sets (measured values are in STATUS.md).
      - run: npm run retrieval -- --cases benchmarks/retrieval/dev.jsonl --budget 2400 --min 0.75
      - run: npm run retrieval -- --cases benchmarks/retrieval/mixed.jsonl --budget 2400 --min 0.75
      - run: npm run retrieval -- --cases benchmarks/retrieval/negatives.jsonl --budget 2400 --min 0.85
      - run: npm run retrieval -- --cases benchmarks/retrieval/ambiguous.jsonl --budget 2400 --min 0.95
      - run: npm run graders
      - run: npm run cost
      - run: npm run compose:demo
      - run: npm run catalog:demo
      # The hook as Claude Code runs it: through sh, with a JSON payload on stdin, exit 0 always.
      - name: hook smoke test
        shell: bash
        env:
          SKILLFORGE_HOOK: brief
        run: |
          out=$(echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci","prompt":"our postgres workers block each other in the job queue"}' | sh plugin/hooks/run-hook.sh)
          echo "$out" | head -c 300
          echo "$out" | grep -q 'lock-skip-locked'
          echo 'not json' | sh plugin/hooks/run-hook.sh
