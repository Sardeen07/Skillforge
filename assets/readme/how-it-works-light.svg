.ln-tm{stroke:#959ca5;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.tick{stroke:#b6bcc4;stroke-width:2}
.mo{fill:none;stroke:#b6bcc4;stroke-width:1.5}
.mm{fill:none;stroke:#959ca5;stroke-width:1.5}
.hair{stroke:#e8eaed;stroke-opacity:.1;stroke-width:1}
