.f-wide{font-family:'SF Archivo Wide', 'SF Archivo', Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600}
.f-sansB{font-family:'SF Archivo', Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600}
.f-sans{font-family:'SF Archivo', Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400}
.bg{fill:#1b1e23}
.card{fill:#23272e;stroke:#e8eaed;stroke-opacity:.1;stroke-width:1}
