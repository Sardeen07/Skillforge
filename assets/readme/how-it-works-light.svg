<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="Three stages. Your task (prompt and project stack) goes to Match rules, a local search over 757 rules where the stack reorders but never picks. Select a brief applies an evidence check and an estimated token budget, and Claude Code receives the relevant rules. With no strong match, Claude gets no task-specific guidance.">
<!-- Fonts: Archivo (Omnibus-Type) and IBM Plex Mono (IBM), subsets embedded under the SIL Open Font License 1.1. -->
<title>From prompt to brief</title>
<style>
@font-face{font-family:'SF Archivo Wide';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'SF Archivo';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
