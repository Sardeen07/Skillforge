<rect class="bg" width="1280" height="500" rx="16"/>
<text x="64" y="68" class="t1 f-wide" font-size="28">From prompt to brief</text>
<rect class="card" x="64.5" y="120.5" width="211" height="179" rx="12"/>
<text x="84" y="160" class="t1 f-sansB" font-size="22">Your task</text>
<text x="84" y="196" class="t2 f-sans" font-size="20">Prompt + project</text>
<text x="84" y="222" class="t2 f-sans" font-size="20">stack</text>
<rect class="card" x="377.8333333333333" y="120.5" width="211" height="179" rx="12"/>
<text x="397.33" y="160" class="t1 f-sansB" font-size="22">Match rules</text>
<text x="397.33" y="196" class="t2 f-sans" font-size="20">Local search over</text>
<text x="397.33" y="222" class="t2 f-sans" font-size="20">757 rules. Stack</text>
<text x="397.33" y="248" class="t2 f-sans" font-size="20">reorders, never</text>
<text x="397.33" y="274" class="t2 f-sans" font-size="20">picks.</text>
<rect class="card" x="691.1666666666666" y="120.5" width="211" height="179" rx="12"/>
<text x="710.67" y="160" class="t1 f-sansB" font-size="22">Select a brief</text>
<text x="710.67" y="196" class="t2 f-sans" font-size="20">Evidence check +</text>
<text x="710.67" y="222" class="t2 f-sans" font-size="20">estimated token</text>
<text x="710.67" y="248" class="t2 f-sans" font-size="20">budget</text>
<rect class="card-ac" x="1004.5" y="120.5" width="211" height="179" rx="12"/>
<text x="1024" y="160" class="t1 f-sansB" font-size="22">Claude Code</text>
<text x="1024" y="196" class="t2 f-sans" font-size="20">Receives the</text>
<text x="1024" y="222" class="t2 f-sans" font-size="20">relevant rules</text>
<line class="ln-main" x1="282" y1="210" x2="361.3333333333333" y2="210"/><polygon class="ac" points="371.3333333333333,210 357.3333333333333,203 357.3333333333333,217"/>
<text x="326.67" y="194" class="tm f-sans" font-size="18" text-anchor="middle">query</text>
<line class="ln-main" x1="595.3333333333333" y1="210" x2="674.6666666666666" y2="210"/><polygon class="ac" points="684.6666666666666,210 670.6666666666666,203 670.6666666666666,217"/>
<text x="640" y="172" class="tm f-sans" font-size="18" text-anchor="middle">ranked</text>
<text x="640" y="194" class="tm f-sans" font-size="18" text-anchor="middle">rules</text>
<line class="ln-main" x1="908.6666666666666" y1="210" x2="988" y2="210"/><polygon class="ac" points="998,210 984,203 984,217"/>
<text x="953.33" y="194" class="tm f-sans" font-size="18" text-anchor="middle">brief</text>
<line class="ln-tm" x1="796.6666666666666" y1="306" x2="796.6666666666666" y2="380"/><polygon class="tm" points="796.6666666666666,388 790.6666666666666,376 802.6666666666666,376"/>
<text x="810.67" y="352" class="tm f-sans" font-size="18">no strong match</text>
<rect class="ghost" x="627.1666666666666" y="392.5" width="339" height="59" rx="12"/>
<text x="796.67" y="429" class="t2 f-sansB" font-size="20" text-anchor="middle">No task-specific guidance</text>
</svg>
